name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          # BEAM loads on the build OTP and up to +2, so these two artifacts
          # cover OTP 25-29 (RabbitMQ 3.11 through the latest 4.x line).
          - {otp: '25', runner: 'ubuntu-22.04'}   # covers OTP 25/26/27
          - {otp: '27', runner: 'ubuntu-latest'}  # covers OTP 27/28/29
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with: { otp-version: '${{ matrix.otp }}', rebar3-version: '3' }
      - run: ./build-ez.sh --rmq-release 3.13.7
      - uses: softprops/action-gh-release@v2
        with: { files: _build/*.ez }
