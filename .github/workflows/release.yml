name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        otp: ['25', '26', '27']   # one .ez per OTP; BEAM loads on the build OTP and up to +2
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3'
      - name: Build .ez
        run: ./build-ez.sh
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: _build/*.ez
