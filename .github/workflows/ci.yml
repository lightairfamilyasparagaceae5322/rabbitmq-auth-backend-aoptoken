name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # Prove the plugin compiles against the RabbitMQ API of each line,
  # from a mainstream version through the latest — on a compatible OTP.
  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {otp: '25', rabbit_common: '3.11.28'}
          - {otp: '25', rabbit_common: '3.12.14'}
          - {otp: '26', rabbit_common: '3.13.7'}
          - {otp: '27', rabbit_common: '4.0.5'}
          - {otp: '27', rabbit_common: '4.1.1'}
    name: rabbit_common ${{ matrix.rabbit_common }} / OTP ${{ matrix.otp }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3'
      - name: Pin rabbit_common for this matrix cell
        run: |
          sed -i 's/{rabbit_common, "[^"]*"}/{rabbit_common, "${{ matrix.rabbit_common }}"}/' rebar.config
          grep rabbit_common rebar.config
      - name: Compile against this RabbitMQ version
        run: rebar3 compile
      - name: Package .ez
        run: ./build-ez.sh "$(ls -d _build/default/lib/rabbit_common)"
      - run: ls -la _build/*.ez
