name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # Compile against each RabbitMQ line's real rabbit_common (from its
  # generic-unix release). Compiling clean means that version exposes the
  # API the plugin depends on. Covers a mainstream version through latest.
  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rmq: ['3.11.28', '3.12.14', '3.13.7', '4.0.5', '4.1.1']
    name: RabbitMQ ${{ matrix.rmq }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with: { otp-version: '26', rebar3-version: '3' }
      - run: ./build-ez.sh --rmq-release ${{ matrix.rmq }}
      - run: ls -la _build/*.ez
